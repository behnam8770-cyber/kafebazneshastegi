<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پنل مدیریت | کافه بازنشستگی</title><style>body{font-family:Tahoma,Arial,sans-serif;background:#f4f7f5;margin:0;color:#18352a}main{max-width:1050px;margin:30px auto;padding:18px}.box{background:white;border:1px solid #dfe8e2;border-radius:18px;padding:22px;margin-bottom:18px;box-shadow:0 5px 25px #00000008}input,textarea,select{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccd8d0;border-radius:10px;font:inherit;margin:7px 0 14px}textarea{min-height:170px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}button{border:0;border-radius:10px;padding:11px 18px;cursor:pointer;font:inherit;background:#176b4d;color:white;margin:4px}.secondary{background:#e9f0ec;color:#174b38}.danger{background:#fff0f0;color:#a22}.muted{color:#66756d}.post{border-top:1px solid #e5ebe7;padding:13px 0;display:flex;justify-content:space-between;gap:10px}.hidden{display:none}.msg{padding:10px;background:#edf7f1;border-radius:10px;margin:10px 0}@media(max-width:700px){.grid{grid-template-columns:1fr}.post{display:block}}</style><main><section id="login" class="box"><h1>ورود مدیر کافه بازنشستگی</h1><p class="muted">این صفحه فقط برای مدیریت مطالب است.</p><input id="password" type="password" placeholder="رمز عبور مدیر"><button onclick="login()">ورود</button><div id="loginMsg"></div></section><section id="app" class="hidden"><div class="box"><div style="display:flex;justify-content:space-between;align-items:center"><div><h1>پنل مدیریت محتوا</h1><p class="muted">ثبت، ویرایش، حذف و انتشار مطالب</p></div><button class="secondary" onclick="logout()">خروج</button></div><div id="msg"></div><form onsubmit="save(event)"><input id="id" type="hidden"><div class="grid"><label>عنوان<input id="title" required></label><label>دسته‌بندی<select id="category"><option>خبر</option><option>اقتصاد</option><option>سلامت</option><option>فناوری</option><option>زندگی</option><option>تجربه</option><option>فرهنگ</option><option>خانواده</option><option>سواد رسانه‌ای</option></select></label></div><label>خلاصه / لید<textarea id="excerpt"></textarea></label><label>متن کامل<textarea id="body" required></textarea></label><label>آدرس تصویر شاخص<input id="image_url" placeholder="https://..."></label><label>وضعیت<select id="status"><option value="published">انتشار</option><option value="draft">پیش‌نویس</option></select></label><button>ذخیره مطلب</button><button type="button" class="secondary" onclick="newPost()">مطلب جدید</button></form></div><div class="box"><h2>مطالب</h2><div id="list"></div></div></section></main><script>const $=id=>document.getElementById(id);async function api(u,o={}){let r=await fetch(u,{...o,headers:{'content-type':'application/json',...(o.headers||{})}}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'خطا');return d}async function check(){try{let d=await api('/api/login');if(d.authenticated)show()}catch(e){}}function show(){$('login').classList.add('hidden');$('app').classList.remove('hidden');load()}async function login(){try{await api('/api/login',{method:'POST',body:JSON.stringify({password:$('password').value})});show()}catch(e){$('loginMsg').innerHTML='<div class="msg">'+e.message+'</div>'}}async function logout(){await api('/api/logout',{method:'POST'});location.reload()}function newPost(){document.querySelector('form').reset();$('id').value='';$('status').value='published';scrollTo(0,0)}async function save(e){e.preventDefault();let b={id:$('id').value,title:$('title').value,category:$('category').value,excerpt:$('excerpt').value,body:$('body').value,image_url:$('image_url').value,status:$('status').value};try{await api('/api/posts',{method:b.id?'PUT':'POST',body:JSON.stringify(b)});$('msg').innerHTML='<div class="msg">مطلب با موفقیت ذخیره شد.</div>';newPost();load()}catch(x){$('msg').innerHTML='<div class="msg">'+x.message+'</div>'}}async function load(){let rows=await api('/api/posts');$('list').innerHTML=rows.length?rows.map(p=>'<div class="post"><div><b>'+esc(p.title)+'</b><div class="muted">'+esc(p.category)+' · '+(p.status==='published'?'منتشر شده':'پیش‌نویس')+'</div></div><div><button class="secondary" onclick=edit('+JSON.stringify(p).replace(/</g,'\\u003c')+')>ویرایش</button><button class="danger" onclick=del('+p.id+')>حذف</button></div></div>').join(''):'<p class="muted">هنوز مطلبی ثبت نشده است.</p>'}function edit(p){['id','title','category','excerpt','body','image_url','status'].forEach(k=>$(k).value=p[k]||'');scrollTo(0,0)}async function del(id){if(confirm('مطلب حذف شود؟')){await api('/api/posts',{method:'DELETE',body:JSON.stringify({id})});load()}}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}check();</script></html>
